# Development overrides: runs `next dev` in the container with the source
# bind-mounted for hot reload. Use via `npm run dev`.
services:
  web:
    build:
      target: dev
    image: web-starter-dev
    environment:
      NODE_ENV: development
    volumes:
      - .:/app
      # Keep the container's own Linux node_modules and build cache instead of
      # the host's; -V on `up` refreshes them after dependency changes.
      - /app/node_modules
      - /app/.next
    restart: "no"
